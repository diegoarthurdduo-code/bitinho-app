name: Publicar versão de teste no GitHub Pages

on:
  push:
    branches:
      - teste/apostila-exercicios
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-teste
  cancel-in-progress: true

jobs:
  publicar-teste:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos da versão de teste
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar prévia
        id: deployment
        uses: actions/deploy-pages@v4
